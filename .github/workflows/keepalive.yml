# Supabase тегін жобасы 7 күн белсенділік болмаса ұйықтап қалады.
# Бұл workflow әр 3 күн сайын базаға бір сұраныс жібереді.
# GitHub 60 күн коммит болмаса кесте бойынша іске қосуды тоқтатады, сондықтан айына бір рет кішкене коммит жасаймыз.
name: Supabase keepalive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js || true)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js || true)
          if [ -z "$URL" ]; then echo "Supabase әлі бапталмаған"; exit 0; fi
          curl -fsS "$URL/rest/v1/topics?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
      - name: Monthly heartbeat commit
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" -le 3 ]; then
            date -u +%FT%TZ > .github/last-ping
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/last-ping
            git commit -m "keepalive: $(date -u +%F)" && git push || true
          fi
